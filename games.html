<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RIPSITE | Игры</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --bg: #09090f;
            --card: #101015;
            --accent: #c11f2b;
            --accent-dark: #c11f2b;
            --text: #e0e0ff;
            --text-muted: #a0a0cc;
            --border: #1e1e28;
            --gradient-start: #0f0f1a;
            --gradient-end: #09090f;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            overflow-x: hidden;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }
        body.modal-open {
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        .top-section {
            background: linear-gradient(
                to bottom,
                #0f0f1a 0%,
                #0c0c16 40%,
                #0a0a13 70%,
                var(--bg) 100%
            );
            padding: 2.8rem 1rem 4.2rem;
            text-align: center;
            position: relative;
        }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3.2rem, 13vw, 8.2rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            color: #c11f2b;
        }
        nav {
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(230,57,70,0.10);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 1rem;
            margin-top: -1px;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.6rem 2.8rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 1.08rem;
            letter-spacing: 0.5px;
            padding: 0.5rem 0.4rem;
            transition: color 0.25s ease;
            position: relative;
        }
        nav a:hover,
        nav a.active {
            color: white;
        }
        nav a.active::after,
        nav a:hover::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            width: 0;
            height: 2.5px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
            transition: width 0.35s ease;
            transform: translateX(-50%);
        }
        nav a:hover::after,
        nav a.active::after {
            width: 85%;
        }
        main {
            max-width: 1480px;
            margin: -3.2rem auto 4rem;
            padding: 0 1.5rem;
            position: relative;
            z-index: 10;
        }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.6rem;
            color: var(--accent);
            text-align: center;
            margin: 3.5rem 0 2rem;
            letter-spacing: -0.03em;
        }
        .intro-text {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 1.12rem;
        }
        .search-container {
            margin: 2.2rem 0;
            text-align: center;
        }
        .search-bar {
            width: 100%;
            max-width: 620px;
            padding: 1.1rem 1.8rem;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--card);
            color: var(--text);
            font-size: 1.08rem;
            outline: none;
            transition: all 0.25s ease;
        }
        .search-bar:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(193,31,43,0.18);
        }
        .sort-container {
            display: flex;
            justify-content: center;
            gap: 1.1rem;
            margin: 1.8rem 0 3rem;
            flex-wrap: wrap;
        }
        .sort-button {
            padding: 0.85rem 1.3rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--text-muted);
            font-size: 1.35rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
        }
        .sort-button:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .sort-button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .steam-widget-section {
            margin: 0.5rem 0 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 1rem;
        }
        .steam-widget-wrap {
            position: relative;
            width: 100%;
            max-width: 900px;
            border-radius: 18px;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 8px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(193,31,43,0.08);
            line-height: 0;
            display: block;
            text-decoration: none;
        }
        .steam-widget-wrap img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 18px;
            position: relative;
            z-index: 1;
        }
        .steam-widget-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 1rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 0.4px;
        }
        .steam-widget-label i {
            color: var(--accent);
            font-size: 1.1rem;
        }
        .tier-container {
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
            margin-bottom: 5rem;
        }
        .tier-row {
            display: flex;
            align-items: stretch;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            min-height: 220px;
            contain: layout paint style;
        }
        .tier-label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 120px;
            min-width: 120px;
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            position: relative;
        }
        .tier-S .tier-label { background: linear-gradient(135deg, #c11f2b, #6a0f17); }
        .tier-A .tier-label { background: linear-gradient(135deg, #c11f2b, #8a1520); }
        .tier-B .tier-label { background: linear-gradient(135deg, #8a1520, #4a0a10); }
        .tier-C .tier-label { background: linear-gradient(135deg, #5a3a7a, #2a1a3a); }
        .tier-D .tier-label { background: linear-gradient(135deg, #2a4a5a, #152530); }
        .tier-E .tier-label { background: linear-gradient(135deg, #3a3a5a, #1a1a2e); }
        .tier-F .tier-label { background: linear-gradient(135deg, #2a2a3a, #151520); }
        .tier-games {
            display: flex;
            flex-wrap: wrap;
            gap: 1.6rem;
            padding: 1.6rem 1.8rem;
            align-items: center;
            flex: 1;
        }
        .game-card {
            width: 200px;
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s ease;
            border-radius: 16px;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--border);
            flex-shrink: 0;
            display: block;
            position: relative;
            contain: layout paint style;
        }
        .game-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
        }
        .game-poster {
            aspect-ratio: 2 / 3;
            width: 100%;
            position: relative;
            background-color: #1a1a24;
            overflow: hidden;
        }
        .game-poster img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .game-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2.4rem 1rem 0.6rem;
            background: linear-gradient(to top, rgba(9,9,15,0.98) 40%, transparent 100%);
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            line-height: 1.35;
            text-shadow: 0 2px 8px rgba(0,0,0,0.95);
            color: var(--text);
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            text-overflow: ellipsis;
        }
        .planned-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.6rem;
            margin-bottom: 5rem;
            padding: 2rem 2rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }
        .planned-list .game-card {
            width: 100%;
            cursor: default;
        }
        .planned-list .game-card:hover {
            transform: translateY(-6px);
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(9,9,15,0.96);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overscroll-behavior: contain;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            max-width: 920px;
            width: 100%;
            height: 510px;
            overflow: hidden;
            position: relative;
            display: flex;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            will-change: transform, opacity;
        }
        .modal:not(.visible) .modal-content {
            opacity: 0;
            transform: translateY(16px) scale(0.98);
        }
        .modal.visible .modal-content {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .modal-content.fullscreen {
            max-width: 100%;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            border-radius: 0;
            border: none;
        }
        .modal-poster {
            width: 340px;
            min-width: 340px;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1a1a24;
            position: relative;
            flex-shrink: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            will-change: opacity, transform;
        }
        .modal-content.fullscreen .modal-poster {
            width: 0;
            min-width: 0;
            opacity: 0;
            transform: translateX(-20px);
            pointer-events: none;
        }
        .modal-poster::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to right,
                transparent 55%,
                rgba(16,16,21,0.7) 85%,
                rgba(16,16,21,1) 100%
            );
            pointer-events: none;
        }
        .modal-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            min-width: 0;
            height: 100%;
        }
        .modal-actions {
            position: absolute;
            top: 1.2rem;
            right: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            z-index: 20;
        }
        .modal-action-btn {
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 1;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: color 0.2s ease, background 0.2s ease;
            background: transparent;
            border: none;
            font-family: inherit;
        }
        .modal-action-btn:hover {
            color: white;
        }
        .modal-action-btn.close-btn {
            font-size: 2.4rem;
            line-height: 1;
            padding-bottom: 4px;
        }
        .modal-header {
            padding: 2rem 2.8rem 1rem;
            flex-shrink: 0;
        }
        .modal-rank {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: white;
            width: 70px;
            height: 70px;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            transition: transform 0.3s ease;
        }
        .modal-content.fullscreen .modal-rank {
            transform: scale(1.15);
        }
        .modal-rank::before {
            content: '';
            position: absolute;
            inset: 4px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: rgba(16,16,21,0.85);
            z-index: 1;
        }
        .modal-rank::after {
            content: '';
            position: absolute;
            inset: 7px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: rgba(16,16,21,0.95);
            z-index: 1;
        }
        .modal-rank > span {
            position: relative;
            z-index: 3;
        }
        .rank-S { background: linear-gradient(135deg, #c11f2b, #6a0f17); }
        .rank-A { background: linear-gradient(135deg, #c11f2b, #8a1520); }
        .rank-B { background: linear-gradient(135deg, #8a1520, #4a0a10); }
        .rank-C { background: linear-gradient(135deg, #5a3a7a, #2a1a3a); }
        .rank-D { background: linear-gradient(135deg, #2a4a5a, #152530); }
        .rank-E { background: linear-gradient(135deg, #3a3a5a, #1a1a2e); }
        .rank-F { background: linear-gradient(135deg, #2a2a3a, #151520); }
        .modal-title {
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 0.8rem;
            letter-spacing: -0.02em;
            line-height: 1.25;
        }
        .modal-content.fullscreen .modal-title {
            font-size: 2.2rem;
        }
        .modal-divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(to right, var(--accent), transparent);
            border-radius: 2px;
            margin-bottom: 0;
            transition: width 0.3s ease;
        }
        .modal-content.fullscreen .modal-divider {
            width: 100px;
            height: 4px;
        }
        .modal-date {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            letter-spacing: 0.3px;
            font-style: italic;
        }
        .modal-content.fullscreen .modal-date {
            font-size: 0.95rem;
        }
        .modal-review-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0 2rem 2.8rem;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) var(--border);
            min-height: 0;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }
        .modal-content.fullscreen .modal-review-wrap {
            padding: 1.5rem 0 4rem 2.8rem;
        }
        .modal-review-wrap::-webkit-scrollbar {
            width: 6px;
        }
        .modal-review-wrap::-webkit-scrollbar-track {
            background: var(--border);
            border-radius: 3px;
        }
        .modal-review-wrap::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }
        .modal-review {
            color: var(--text);
            font-size: 0.88rem;
            line-height: 1.65;
            position: relative;
            padding-left: 0.6rem;
            padding-right: 2.8rem;
            border-left: 2px solid rgba(193,31,43,0.35);
            white-space: pre-wrap;
        }
        .modal-content.fullscreen .modal-review {
            font-size: 1rem;
            line-height: 1.75;
        }
        .modal-review::before {
            position: absolute;
            left: -2px;
            top: -13px;
            font-size: 3rem;
            color: rgba(193,31,43,0.4);
            font-family: Georgia, serif;
            line-height: 1;
        }
        .game-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 1px dashed rgba(193,31,43,0.5);
            transition: color 0.2s ease, border-color 0.2s ease;
            position: relative;
            display: inline;
        }
        .game-link:hover {
            color: #ff2d3d;
            border-bottom-color: #ff2d3d;
        }
        .game-hover-preview {
            display: none;
            position: fixed;
            z-index: 99999;
            background: var(--card);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.85);
            pointer-events: none;
            align-items: center;
            gap: 10px;
        }
        .game-hover-preview.visible {
            display: flex;
        }
        .game-hover-preview .preview-poster {
            width: 64px;
            height: 96px;
            border-radius: 6px;
            background-size: cover;
            background-position: center;
            background-color: #1a1a24;
            flex-shrink: 0;
        }
        .game-hover-preview .preview-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .game-hover-preview .preview-rank {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: white;
            width: 44px;
            height: 44px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            position: relative;
        }
        .game-hover-preview .preview-rank::before {
            content: '';
            position: absolute;
            inset: 3px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: rgba(16,16,21,0.85);
            z-index: 1;
        }
        .game-hover-preview .preview-rank::after {
            content: '';
            position: absolute;
            inset: 5px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: rgba(16,16,21,0.95);
            z-index: 1;
        }
        .game-hover-preview .preview-rank > span {
            position: relative;
            z-index: 3;
        }
        .all-games-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.6rem;
            margin-bottom: 5rem;
            padding: 2rem 2rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }
        .all-games-list .game-card {
            width: 100%;
        }
        footer {
            text-align: center;
            padding: 4.5rem 1rem 3.5rem;
            color: #4a4a60;
            font-size: 0.95rem;
            border-top: 1px solid #181822;
        }

        @media (max-width: 820px) {
            main {
                margin-top: -2.4rem;
                padding: 0 1.2rem;
            }
            .top-section {
                padding: 2.2rem 1rem 3.6rem;
            }
            header h1 {
                font-size: clamp(2.8rem, 11vw, 6.2rem);
            }
            nav ul {
                gap: 1rem 1.4rem;
            }
            .section-title {
                font-size: 2.1rem;
                margin: 2.8rem 0 1.6rem;
            }
            .steam-widget-section {
                margin: 2.8rem 0 1.6rem;
            }
            .steam-widget-wrap {
                border-radius: 14px;
            }
            .steam-widget-wrap img {
                border-radius: 14px;
            }
            .steam-widget-label {
                font-size: 0.85rem;
            }
            .tier-label {
                width: 80px;
                min-width: 80px;
                font-size: 2.2rem;
            }
            .tier-games {
                padding: 1.2rem;
                gap: 1rem;
            }
            .game-card {
                width: 155px;
            }
            .game-title {
                font-size: 0.95rem;
                padding: 2rem 0.8rem 0.5rem;
            }
            .planned-list {
                grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
                gap: 1rem;
                padding: 1.4rem;
            }
            .all-games-list {
                grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
                gap: 1rem;
                padding: 1.4rem;
            }
            .modal-content {
                height: 400px;
            }
            .modal-poster {
                width: 220px;
                min-width: 220px;
            }
            .modal-header {
                padding: 1.6rem 1.8rem 0.8rem;
            }
            .modal-review-wrap {
                padding: 0.8rem 0 1.6rem 1.8rem;
            }
            .modal-content.fullscreen .modal-review-wrap {
                padding: 1rem 0 3rem 1.8rem;
            }
            .modal-rank {
                width: 58px;
                height: 58px;
                font-size: 1.8rem;
            }
            .modal-title {
                font-size: 1.35rem;
            }
            .modal-review {
                font-size: 0.82rem;
                padding-right: 1.8rem;
            }
            .sort-button {
                width: 48px;
                height: 48px;
                font-size: 1.25rem;
            }
        }

        @media (max-width: 560px) {
            .steam-widget-section {
                margin: 2.2rem 0 1.2rem;
                padding: 0 0.4rem;
            }
            .steam-widget-wrap {
                border-radius: 12px;
            }
            .steam-widget-wrap img {
                border-radius: 12px;
            }
            .steam-widget-label {
                font-size: 0.78rem;
                gap: 0.4rem;
            }
            .steam-widget-label i {
                font-size: 0.9rem;
            }
            .tier-games {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
                padding: 1rem;
            }
            .game-card {
                width: 100%;
            }
            .game-title {
                font-size: 0.82rem;
                padding: 1.6rem 0.5rem 0.4rem;
                -webkit-line-clamp: 2;
            }
            .planned-list {

        function makeImageName(title) {
            return title.toLowerCase().replace(/\s+/g, '_');
        }

        function slugify(title) {
            return encodeURIComponent(title);
        }

        function createLazyImage(imagePath, className) {
            const img = document.createElement('img');
            img.className = className;
            img.dataset.src = imagePath;
            img.loading = 'lazy';
            img.decoding = 'async';
            return img;
        }

        function getGameByTitle(title) {
            return gamesData.find(g => g.title === title);
        }

        function renderReview(comment) {
            const allTitles = gamesData
                .map(g => g.title)
                .filter(t => t.trim() !== '')
                .sort((a, b) => b.length - a.length);

            if (!comment || comment.trim() === '') return '';

            let result = '';
            let lastIndex = 0;
            const lowerComment = comment.toLowerCase();

            while (lastIndex < comment.length) {
                let found = false;
                let earliestMatch = null;

                for (const title of allTitles) {
                    const idx = lowerComment.indexOf(title.toLowerCase(), lastIndex);
                    if (idx !== -1 && (earliestMatch === null || idx < earliestMatch.index)) {
                        earliestMatch = { title, index: idx };
                    }
                }

                if (earliestMatch === null) {
                    result += escapeHtml(comment.slice(lastIndex));
                    break;
                }

                if (earliestMatch.index > lastIndex) {
                    result += escapeHtml(comment.slice(lastIndex, earliestMatch.index));
                }

                const game = getGameByTitle(earliestMatch.title);
                const imagePath = `files/images/Gameicon/${makeImageName(game.title)}.png`;
                const rankClass = game.rang ? `rank-${game.rang}` : '';
                const rankDisplay = game.rang || '?';

                result += `<span class="game-link" data-game-title="${escapeHtml(earliestMatch.title)}" data-game-image="${escapeHtml(imagePath)}" data-game-rank="${escapeHtml(rankDisplay)}" data-rank-class="${rankClass}" onclick="openGameFromReview('${escapeHtml(earliestMatch.title)}')">${escapeHtml(earliestMatch.title)}</span>`;
                lastIndex = earliestMatch.index + earliestMatch.title.length;
            }

            return result;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function openGameFromReview(title) {
            const game = getGameByTitle(title);
            if (!game) return;

            hideHoverPreview();
            const imagePath = `files/images/Gameicon/${makeImageName(game.title)}.png`;

            showReview(game.title, game.comment, game.rang, imagePath, game.date || '');

        function updateURL(title) {
            const url = new URL(window.location);
            if (title) {
                url.searchParams.set('game', title);
            } else {
                url.searchParams.delete('game');
            }
            history.replaceState({ game: title || null }, '', url);

            return params.get('game');

        function parseDate(dateStr) {
            if (!dateStr || dateStr.trim() === '') return null;
            const parts = dateStr.split('.');
            if (parts.length !== 3) return null;
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const year = parseInt(parts[2], 10);
            if (isNaN(day) || isNaN(month) || isNaN(year)) return null;
            return new Date(year, month, day);
        }

        function sortGames(games) {
            if (!currentSort) return games;

            const sorted = [...games];

            switch (currentSort) {
                case 'title-asc':
                    sorted.sort((a, b) => a.title.localeCompare(b.title));
                    break;
                case 'title-desc':
                    sorted.sort((a, b) => b.title.localeCompare(a.title));
                    break;
                case 'date-asc':
                    sorted.sort((a, b) => {
                        const da = parseDate(a.date);
                        const db = parseDate(b.date);
                        if (!da && !db) return 0;
                        if (!da) return 1;
                        if (!db) return -1;
                        return da - db;
                    });
                    break;
                case 'date-desc':
                    sorted.sort((a, b) => {
                        const da = parseDate(a.date);
                        const db = parseDate(b.date);
                        if (!da && !db) return 0;
                        if (!da) return 1;
                        if (!db) return -1;
                        return db - da;
                    });
                    break;
            }

            return sorted;
        }

        function buildGameCard(game, clickable = true) {
            const imagePath = `files/images/Gameicon/${makeImageName(game.title)}.png`;

            const card = document.createElement('div');
            card.className = 'game-card';
            if (clickable) {
                card.dataset.title = game.title;
                card.dataset.comment = game.comment;
                card.dataset.rank = game.rang;
                card.dataset.image = imagePath;
                card.dataset.date = game.date || '';
            }

            const posterDiv = document.createElement('div');
            posterDiv.className = 'game-poster';

            const img = createLazyImage(imagePath, 'game-poster-img');
            img.onload = function() {
                this.style.opacity = '1';
            };
            img.onerror = function() {
                this.style.display = 'none';
            };
            posterDiv.appendChild(img);

            const titleDiv = document.createElement('div');
            titleDiv.className = 'game-title';
            titleDiv.textContent = game.title;
            posterDiv.appendChild(titleDiv);

            card.appendChild(posterDiv);
            return card;
        }

        function displayTiers() {
            const tierContainer = document.getElementById('tierContainer');
            const plannedContainer = document.getElementById('plannedList');
            const searchResultsContainer = document.getElementById('searchResultsContainer');
            const searchResultsList = document.getElementById('searchResultsList');
            const tierlistWrapper = document.getElementById('tierlistContainer');
            const plannedWrapper = document.getElementById('plannedContainer');

            tierContainer.innerHTML = '';
            plannedContainer.innerHTML = '';
            searchResultsList.innerHTML = '';

            if (currentSearch) {
                // Show search results, hide tierlist and planned
                tierlistWrapper.style.display = 'none';
                plannedWrapper.style.display = 'none';
                searchResultsContainer.style.display = 'block';

                const allGames = gamesData.filter(game =>
                    game.title.toLowerCase().includes(currentSearch)
                );

                const sorted = sortGames(allGames);

                sorted.forEach(game => {
                    const card = buildGameCard(game, true);
                    searchResultsList.appendChild(card);
                });

                if (allGames.length === 0) {
                    searchResultsList.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">Ничего не найдено</p>';
                }
            } else {
                // Show tierlist and planned, hide search results
                searchResultsContainer.style.display = 'none';
                tierlistWrapper.style.display = 'block';
                plannedWrapper.style.display = 'block';

                const frag = document.createDocumentFragment();

                tierOrder.forEach(tier => {
                    let gamesInTier = gamesData.filter(game => game.rang === tier);
                    gamesInTier = sortGames(gamesInTier);

                    const row = document.createElement('div');
                    row.className = `tier-row tier-${tier}`;

                    const label = document.createElement('div');
                    label.className = 'tier-label';
                    label.textContent = tier;
                    row.appendChild(label);

                    const gamesWrap = document.createElement('div');
                    gamesWrap.className = 'tier-games';

                    gamesInTier.forEach(game => {
                        const card = buildGameCard(game, true);
                        gamesWrap.appendChild(card);
                    });

                    row.appendChild(gamesWrap);
                    frag.appendChild(row);
                });

                tierContainer.appendChild(frag);

                let plannedGames = gamesData.filter(game => game.rang === "_");
                plannedGames = sortGames(plannedGames);

                const plannedFrag = document.createDocumentFragment();
                plannedGames.forEach(game => {
                    const card = buildGameCard(game, false);
                    plannedFrag.appendChild(card);
                });

                plannedContainer.appendChild(plannedFrag);
            }

            updateSortButtons();
            observeLazyImages();
        }

        function observeLazyImages() {
            const images = document.querySelectorAll('img[data-src]');
            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            img.src = img.dataset.src;
                            img.removeAttribute('data-src');
                            obs.unobserve(img);
                        }
                    });
                }, {
                    rootMargin: '300px 0px',
                    threshold: 0.01
                });
                images.forEach(img => observer.observe(img));
            } else {
                images.forEach(img => {
                    img.src = img.dataset.src;
                    img.removeAttribute('data-src');
                });
            }
        }

        const hoverPreview = document.getElementById('globalHoverPreview');
        const hoverPoster = document.getElementById('hoverPoster');
        const hoverRank = document.getElementById('hoverRank');
        let hoveredLink = null;

        function positionHoverPreview(link) {
            const rect = link.getBoundingClientRect();
            const previewRect = hoverPreview.getBoundingClientRect();
            const padding = 8;

            let top = rect.top - previewRect.height - padding;
            let left = rect.left + rect.width / 2 - previewRect.width / 2;

            if (top < padding) {
                top = rect.bottom + padding;
            }

            if (left < padding) {
                left = padding;
            } else if (left + previewRect.width > window.innerWidth - padding) {
                left = window.innerWidth - previewRect.width - padding;
            }

            if (top + previewRect.height > window.innerHeight - padding) {
                top = window.innerHeight - previewRect.height - padding;
            }

            hoverPreview.style.top = top + 'px';
            hoverPreview.style.left = left + 'px';
        }

        function showHoverPreview(link) {
            const imagePath = link.dataset.gameImage || '';
            const rank = link.dataset.gameRank || '?';
            const rankClass = link.dataset.rankClass || '';

            hoverPoster.style.backgroundImage = `url('${imagePath}')`;
            hoverRank.className = 'preview-rank ' + rankClass;
            hoverRank.querySelector('span').textContent = rank;

            hoverPreview.classList.add('visible');
            positionHoverPreview(link);
            hoveredLink = link;
        }

        function hideHoverPreview() {
            hoverPreview.classList.remove('visible');
            hoveredLink = null;
        }

        document.addEventListener('mouseover', function(e) {
            const link = e.target.closest('.game-link');
            if (!link) return;
            showHoverPreview(link);
        });

        document.addEventListener('mouseout', function(e) {
            const link = e.target.closest('.game-link');
            if (!link) return;

            const related = e.relatedTarget;
            if (related && related.closest && related.closest('.game-link') === link) return;

            hideHoverPreview();
        });

        document.addEventListener('mousedown', function() {
            hideHoverPreview();
        });

        document.addEventListener('click', function() {
            hideHoverPreview();
        });

        window.addEventListener('scroll', function() {
            if (hoveredLink && hoverPreview.classList.contains('visible')) {
                positionHoverPreview(hoveredLink);
            }
        }, { passive: true });

        window.addEventListener('resize', function() {
            if (hoveredLink && hoverPreview.classList.contains('visible')) {
                positionHoverPreview(hoveredLink);
            }
        });

        function showReview(title, comment, rank, imagePath, dateStr) {
            const modal = document.getElementById('reviewModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalReview = document.getElementById('modalReview');
            const modalRank = document.getElementById('modalRank');
            const modalPoster = document.getElementById('modalPoster');
            const modalContent = document.getElementById('modalContent');
            const modalDate = document.getElementById('modalDate');

            savedScrollY = window.scrollY;
            document.body.classList.add('modal-open');
            document.body.style.top = `-${savedScrollY}px`;

            modalTitle.textContent = title;
            modalReview.innerHTML = renderReview(comment);
            modalRank.querySelector('span').textContent = rank;
            modalRank.className = 'modal-rank rank-' + rank;

            if (dateStr && dateStr.trim() !== '') {
                modalDate.textContent = 'Дата написания: ' + dateStr;
                modalDate.style.display = 'block';
            } else {
                modalDate.textContent = '';
                modalDate.style.display = 'none';
            }

            modalContent.classList.remove('fullscreen');
            isFullscreen = false;
            updateFullscreenUI();

            modalPoster.style.backgroundImage = `url('${imagePath}')`;

            modal.style.display = 'flex';
            modal.classList.remove('visible');

            if (modalVisibleTimer) cancelAnimationFrame(modalVisibleTimer);
            modalVisibleTimer = requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    modal.classList.add('visible');
                });
            });

            const reviewWrap = modal.querySelector('.modal-review-wrap');
            if (reviewWrap) reviewWrap.scrollTop = 0;
        }

        function toggleFullscreen() {
            isFullscreen = !isFullscreen;
            updateFullscreenUI();
        }

        function updateFullscreenUI() {
            const modalContent = document.getElementById('modalContent');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            
            if (isFullscreen) {
                modalContent.classList.add('fullscreen');
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
                fullscreenBtn.title = 'Свернуть';
            } else {
                modalContent.classList.remove('fullscreen');
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
                fullscreenBtn.title = 'На весь экран';
            }
        }

        function closeModal() {
            const modal = document.getElementById('reviewModal');
            modal.classList.remove('visible');
            updateURL(null);
            hideHoverPreview();

            setTimeout(() => {
                modal.style.display = 'none';
                if (isFullscreen) {
                    isFullscreen = false;
                    updateFullscreenUI();
                }
                document.body.classList.remove('modal-open');
                document.body.style.top = '';
                window.scrollTo(0, savedScrollY);
            }, 200);
        }

        window.onclick = function(event) {
            const modal = document.getElementById('reviewModal');
            if (event.target === modal) {
                if (isFullscreen) {
                    isFullscreen = false;
                    updateFullscreenUI();
                } else {
                    closeModal();
                }
            }
        };

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                const modal = document.getElementById('reviewModal');
                if (modal.style.display === 'flex') {
                    if (isFullscreen) {
                        isFullscreen = false;
                        updateFullscreenUI();
                    } else {
                        closeModal();
                    }
                }
            }
        });

        document.getElementById('tierContainer').addEventListener('click', function(e) {
            const card = e.target.closest('.game-card');
            if (!card || !card.dataset.title) return;
            updateURL(card.dataset.title);
            showReview(card.dataset.title, card.dataset.comment, card.dataset.rank, card.dataset.image, card.dataset.date);
        });

        document.getElementById('searchResultsList').addEventListener('click', function(e) {
            const card = e.target.closest('.game-card');
            if (!card || !card.dataset.title) return;
            updateURL(card.dataset.title);
            showReview(card.dataset.title, card.dataset.comment, card.dataset.rank, card.dataset.image, card.dataset.date);
        });

        window.addEventListener('popstate', function(event) {
            const modal = document.getElementById('reviewModal');
            if (modal.style.display === 'flex') {
                if (isFullscreen) {
                    isFullscreen = false;
                    updateFullscreenUI();
                    history.pushState({ modal: true, fullscreen: false }, '');
                } else {
                    closeModal();
                }
            } else {
                const gameTitle = getGameFromURL();
                if (gameTitle) {
                    const game = getGameByTitle(gameTitle);
                    if (game) {
                        const imagePath = `files/images/Gameicon/${makeImageName(game.title)}.png`;
                        showReview(game.title, game.comment, game.rang, imagePath, game.date || '');
                    }
                }
            }
        });

        window.onload = function() {
            displayTiers();

            const gameTitle = getGameFromURL();
            if (gameTitle) {
                const game = getGameByTitle(gameTitle);
                if (game) {
                    const imagePath = `files/images/Gameicon/${makeImageName(game.title)}.png`;
                    showReview(game.title, game.comment, game.rang, imagePath, game.date || '');
                    history.replaceState({ modal: true, fullscreen: false, game: gameTitle }, '', window.location.href);
                } else {
                    history.replaceState({ modal: false }, '', window.location.pathname);
                }
            } else {
                history.replaceState({ modal: false }, '', window.location.pathname);
            }
        };
    </script>
</body>
