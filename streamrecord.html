<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIPSITE | Записи стримов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --bg: #09090f;
            --card: #101015;
            --accent: #c11f2b;
            --accent-dark: #c11f2b;
            --text: #e0e0ff;
            --text-muted: #a0a0cc;
            --border: #1e1e28;
            --gradient-start: #0f0f1a;
            --gradient-end: #09090f;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }
        .top-section {
            background: linear-gradient(
                to bottom,
                #0f0f1a 0%,
                #0c0c16 40%,
                #0a0a13 70%,
                var(--bg) 100%
            );
            padding: 2.8rem 1rem 4.2rem;
            text-align: center;
            position: relative;
        }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3.2rem, 13vw, 8.2rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            color: #c11f2b;
        }
        nav {
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(230,57,70,0.10);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 1rem;
            margin-top: -1px;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.6rem 2.8rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 1.08rem;
            letter-spacing: 0.5px;
            padding: 0.5rem 0.4rem;
            transition: all 0.25s ease;
            position: relative;
        }
        nav a:hover,
        nav a.active {
            color: white;
        }
        nav a.active::after,
        nav a:hover::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            width: 0;
            height: 2.5px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
            transition: width 0.35s ease;
            transform: translateX(-50%);
        }
        nav a:hover::after,
        nav a.active::after {
            width: 85%;
        }
        main {
            max-width: 1480px;
            margin: -3.2rem auto 4rem;
            padding: 0 1.5rem;
            position: relative;
            z-index: 10;
        }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.6rem;
            color: var(--accent);
            text-align: center;
            margin: 3.5rem 0 2rem;
            letter-spacing: -0.03em;
        }
        .intro-text {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 1.12rem;
        }
        .stream-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem 1.6rem;
            margin-bottom: 5rem;
        }
        .stream-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.28s ease;
            text-decoration: none;
            color: inherit;
            position: relative;
            display: block;
            cursor: pointer;
        }
        .stream-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 20px 48px rgba(0,0,0,0.4);
        }
        .stream-cover {
            aspect-ratio: 16 / 9;
            width: 100%;
            background: #0d0d14;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .stream-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .stream-cover .placeholder-icon {
            font-size: 3.5rem;
            color: var(--accent);
            opacity: 0.7;
        }
        .stream-title {
            padding: 1.2rem 1.2rem 1.4rem;
            text-align: center;
            font-weight: 700;
            font-size: 1.15rem;
            line-height: 1.4;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.05rem;
            margin-bottom: 2rem;
            transition: color 0.25s ease;
        }
        .back-link:hover {
            color: white;
        }
        .player-container {
            max-width: 1100px;
            margin: 0 auto 2rem;
            width: 100%;
        }
        .player-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--card);
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .episodes-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
            margin-bottom: 3rem;
        }
        .episode-btn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.9rem 1.6rem;
            color: var(--text);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .episode-btn:hover,
        .episode-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(193,31,43,0.25);
        }
        footer {
            text-align: center;
            padding: 4.5rem 1rem 3.5rem;
            color: #4a4a60;
            font-size: 0.95rem;
            border-top: 1px solid #181822;
        }
        @media (max-width: 820px) {
            main {
                margin-top: -2.4rem;
                padding: 0 1.2rem;
            }
            .top-section {
                padding: 2.2rem 1rem 3.6rem;
            }
            header h1 {
                font-size: clamp(2.8rem, 11vw, 6.2rem);
            }
            nav ul {
                gap: 1rem 1.4rem;
            }
            .section-title {
                font-size: 2.1rem;
                margin: 2.8rem 0 1.6rem;
            }
            .stream-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.4rem 1rem;
            }
            .stream-title {
                font-size: 1rem;
                padding: 1rem 0.8rem 1.2rem;
            }
        }
        @media (max-width: 480px) {
            .stream-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.2rem 0.9rem;
            }
            .stream-title {
                font-size: 0.9rem;
                padding: 0.8rem 0.6rem 1rem;
            }
            .episode-btn {
                padding: 0.75rem 1.2rem;
                font-size: 0.92rem;
            }
        }
    </style>
</head>
<body>
    <div class="top-section">
        <header>
            <h1>RIPSITE</h1>
        </header>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="links.html">Ссылки</a></li>
                <li><a href="different.html">Разное</a></li>
                <li><a href="anime.html">Аниме</a></li>
                <li><a href="movies.html">Фильмы</a></li>
                <li><a href="games.html">Игры</a></li>
            </ul>
        </nav>
    </div>

    <main>
        <h2 class="section-title">Записи стримов</h2>
        <p class="intro-text" id="introText">Выбери чтобы посмотреть записи</p>
        <div id="content"></div>
    </main>

    <footer>
        <p>© 2025–2026 RIPSITE · Все права защищены</p>
    </footer>
    <script src="agreement.js" defer></script>
    <script>
        const RecategData = [
            {
                categName: "The Binding of Isaac",
                folder: "The-Binding-of-Isaac",
                episodes: ["okkbajoMOAAA", "okkZej4MOAAA", "okkaU4YUOAAA"]
            },
            {
                categName: "Minecraft Dungeons",
                folder: "minecraft-dungeons",
                episodes: ["okkbnbIoOAAA", "okkaIEZMOAAA", "okkZvB5gOAAA"]
            }
        ];

        const basePath = "files/images/Fullgameicon/";

        function getParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                game: params.get('game'),
                v: params.get('v')
            };
        }

        function render() {
            const container = document.getElementById('content');
            const introText = document.getElementById('introText');
            const params = getParams();
            container.innerHTML = '';

            if (params.game) {
                const game = RecategData.find(g => g.folder === params.game);
                if (game) {
                    let index = 0;
                    if (params.v !== null) {
                        const parsed = parseInt(params.v);
                        if (!isNaN(parsed) && parsed >= 0 && parsed < game.episodes.length) {
                            index = parsed;
                        }
                    }
                    introText.style.display = 'none';
                    renderPlayer(container, game, index);
                    return;
                }
            }

            introText.textContent = 'Выбери чтобы посмотреть записи';
            renderGames(container);
        }

        function renderGames(container) {
            const grid = document.createElement('div');
            grid.className = 'stream-grid';

            RecategData.forEach(game => {
                const card = document.createElement('a');
                card.className = 'stream-card';
                card.href = `?game=${game.folder}`;

                const coverDiv = document.createElement('div');
                coverDiv.className = 'stream-cover';

                const img = document.createElement('img');
                img.src = basePath + game.folder + ".png";
                img.alt = game.categName;
                img.decoding = 'async';
                img.addEventListener('error', function () {
                    coverDiv.innerHTML = '<i class="fa-solid fa-folder-open placeholder-icon"></i>';
                });
                coverDiv.appendChild(img);

                const titleDiv = document.createElement('div');
                titleDiv.className = 'stream-title';
                titleDiv.textContent = game.categName;

                card.appendChild(coverDiv);
                card.appendChild(titleDiv);
                grid.appendChild(card);
            });

            container.appendChild(grid);
        }

        function renderPlayer(container, game, index) {
            const backLink = document.createElement('a');
            backLink.className = 'back-link';
            backLink.href = window.location.pathname;
            backLink.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Вернуться назад';
            container.appendChild(backLink);

            const playerContainer = document.createElement('div');
            playerContainer.className = 'player-container';

            const playerWrapper = document.createElement('div');
            playerWrapper.className = 'player-wrapper';

            const iframe = document.createElement('iframe');
            iframe.src = `https://dzen.ru/embed/${game.episodes[index]}`;
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
            iframe.referrerPolicy = 'strict-origin-when-cross-origin';
            iframe.allowFullscreen = true;

            playerWrapper.appendChild(iframe);
            playerContainer.appendChild(playerWrapper);

            const episodesRow = document.createElement('div');
            episodesRow.className = 'episodes-row';

            game.episodes.forEach((dzen, i) => {
                const btn = document.createElement('button');
                btn.className = 'episode-btn' + (i === index ? ' active' : '');
                btn.textContent = "ЗАПИСЬ " + (i + 1);
                btn.addEventListener('click', function () {
                    window.location.href = `?game=${game.folder}&v=${i}`;
                });
                episodesRow.appendChild(btn);
            });

            playerContainer.appendChild(episodesRow);
            container.appendChild(playerContainer);
        }

        render();
    </script>
</body>
</html>
