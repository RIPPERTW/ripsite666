name: Deploy with normalized assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare dist
        run: |
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='scripts' \
                --exclude='.github' --exclude='dist' ./ dist/

      - name: Lowercase image filenames
        run: |
          cd dist
          find . -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \
            -o -iname '*.gif' -o -iname '*.svg' -o -iname '*.webp' \) | while read -r f; do
              d=$(dirname "$f"); b=$(basename "$f"); l=$(echo "$b" | tr '[:upper:]' '[:lower:]')
              [ "$b" = "$l" ] && continue
              if [ -e "$d/$l" ]; then
                echo "COLLISION: $f vs $d/$l"; exit 1
              fi
              mv -- "$f" "$d/$l"
            done

      - name: Lowercase references in html/css/js
        run: node scripts/fix-links.mjs dist

      - name: Sanity check
        run: |
          node - <<'EOF'
          const fs = require('fs'), path = require('path');
          const EXTS = new Set(['.html','.htm','.css','.js']);
          const IMG_EXT = '(?:png|jpe?g|gif|svg|webp|avif|ico)';
          const ATTR_RE = /\b(src|href|data-src|data-bg|data-image|poster|content|xlink:href|background)\s*=\s*(["'])([^"']+)\2/gi;
          const URL_RE = /url\(\s*(["']?)([^"')]+)\1\s*\)/gi;
          const STR_RE = new RegExp(`(["'\`])([^"'\`]*?\\.${IMG_EXT})([?#][^"'\`]*)?\\1`, 'gi');
          const isExternal = (u) => /^(https?:)?\/\//i.test(u) || u.startsWith('data:') || u.startsWith('#') || u.startsWith('mailto:') || u.startsWith('tel:');
          let bad = 0;
          const check = (p, url) => {
            if (isExternal(url)) return;
            if (!new RegExp(`\\.${IMG_EXT}([?#]|$)`, 'i').test(url)) return;
            const clean = url.split(/[?#]/)[0];
            if (/[A-Z]/.test(clean)) { console.log('BAD:', p, '->', url); bad++; }
          };
          const walk = (d) => {
            for (const e of fs.readdirSync(d, {withFileTypes:true})) {
              const p = path.join(d, e.name);
              if (e.isDirectory()) { walk(p); continue; }
              if (!EXTS.has(path.extname(e.name).toLowerCase())) continue;
              const src = fs.readFileSync(p, 'utf8');
              for (const m of src.matchAll(ATTR_RE)) check(p, m[3]);
              for (const m of src.matchAll(URL_RE)) check(p, m[2]);
              for (const m of src.matchAll(STR_RE)) check(p, m[2] + (m[3] ?? ''));
            }
          };
          walk('dist');
          if (bad) { console.error(`Uppercase in image paths: ${bad}`); process.exit(1); }
          console.log('OK: all image refs lowercase');
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
