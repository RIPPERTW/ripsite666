name: Deploy with normalized assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare dist
        run: |
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='scripts' \
                --exclude='.github' --exclude='dist' ./ dist/

      - name: Lowercase image filenames
        run: |
          cd dist
          find . -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \
            -o -iname '*.gif' -o -iname '*.svg' -o -iname '*.webp' \) | while read -r f; do
              d=$(dirname "$f"); b=$(basename "$f"); l=$(echo "$b" | tr '[:upper:]' '[:lower:]')
              [ "$b" = "$l" ] && continue
              if [ -e "$d/$l" ]; then
                echo "COLLISION: $f vs $d/$l"; exit 1
              fi
              mv -- "$f" "$d/$l"
            done

      - name: Lowercase references in html/css/js
        run: node scripts/fix-links.mjs dist

      - name: Sanity check
        run: |
          if grep -rEn '\.(png|jpe?g|gif|svg|webp)' dist --include='*.html' --include='*.css' --include='*.js' \
             | grep -E '[A-Z]' ; then
            echo "Uppercase image refs left"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
