<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIPSITE | Minecraft</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --bg: #09090f;
            --card: #101015;
            --accent: #c11f2b;
            --text: #e0e0ff;
            --text-muted: #a0a0cc;
            --border: #1e1e28;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }
        .top-section {
            background: linear-gradient(to bottom, #0f0f1a 0%, #0c0c16 40%, #0a0a13 70%, var(--bg) 100%);
            padding: 2.8rem 1rem 4.2rem;
            text-align: center;
        }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3.2rem, 13vw, 8.2rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            color: #c11f2b;
        }
        nav {
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(230,57,70,0.10);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 1rem;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.6rem 2.8rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 1.08rem;
            padding: 0.5rem 0.4rem;
            position: relative;
        }
        nav a:hover, nav a.active { color: white; }
        nav a.active::after, nav a:hover::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            width: 85%;
            height: 2.5px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
            transform: translateX(-50%);
        }
        main {
            max-width: 1480px;
            margin: -3.2rem auto 4rem;
            padding: 0 1.5rem;
        }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.6rem;
            color: var(--accent);
            text-align: center;
            margin: 3.5rem 0 2rem;
        }
        .intro-text {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 1.12rem;
        }
        .platform-switcher {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
        }
        .platform-btn {
            padding: 0.9rem 2.2rem;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-muted);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .platform-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 18px;
            border: 1px solid var(--border);
            margin-bottom: 3rem;
            background: #000;
            box-shadow: 0 15px 45px rgba(0,0,0,0.5);
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        .clip-switcher {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.4rem;
        }
        .clip-btn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.6rem 1.2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.28s ease;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.08rem;
        }
        .clip-btn:hover, .clip-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-6px);
        }
        footer {
            text-align: center;
            padding: 4.5rem 1rem 3.5rem;
            color: #4a4a60;
            font-size: 0.95rem;
            border-top: 1px solid #181822;
        }
    </style>
</head>
<body>
    <div class="top-section">
        <header><h1>RIPSITE</h1></header>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="links.html">Ссылки</a></li>
                <li><a href="different.html">Разное</a></li>
                <li><a href="anime.html">Аниме</a></li>
                <li><a href="movies.html">Фильмы</a></li>
                <li><a href="games.html">Игры</a></li>
            </ul>
        </nav>
    </div>

    <main>
        <h2 class="section-title">Смерти</h2>
        <p class="intro-text">Все мои смерти здесь</p>

        <div class="platform-switcher">
            <button class="platform-btn active" data-platform="dzen">Дзен</button>
            <button class="platform-btn" data-platform="twitch">Twitch</button>
        </div>

        <div class="video-container">
            <iframe id="clip-player" src="" allowfullscreen></iframe>
        </div>

        <div class="clip-switcher" id="clipSwitcher"></div>
    </main>

    <footer>
        <p>© 2025–2026 RIPSITE · Все права защищены</p>
    </footer>

    <script src="agreement.js" defer></script>
    <script>
        const minecraftClips = [
            {
                title: "Смерть 1 - 56:25",
                dzenId: "okkZyIR0NAAA",
                twitchId: "ScaryResolutePlumSpicyBoy-61MeZLP-aTtnl9S6"
            },
            {
                title: "Смерть 2 - 01:08:16",
                dzenId: "okkYHIh0NAAA",
                twitchId: "VictoriousSolidDogeCeilingCat-KzrKTsY4bQy94yFb"
            },
            {
                title: "Смерть 3 - 02:50:31",
                dzenId: "okkYrIh0NAAA",
                twitchId: "OutstandingToughPeafowlTebowing-fnifpmQxe-ZekvO7"
            },
            {
                title: "Смерть 4 - 02:23:48",
                dzenId: "okkZYIh0NAAA",
                twitchId: "LittleInventiveSandwichPogChamp-1BOrVqNpXuWRJyp-"
            }
        ];

        let currentPlatform = "dzen";

        function createClipButtons(platform) {
            const container = document.getElementById('clipSwitcher');
            container.innerHTML = '';

            minecraftClips.forEach((clip, index) => {
                const btn = document.createElement('div');
                btn.className = `clip-btn ${index === 0 ? 'active' : ''}`;
                btn.innerHTML = `
                    <i class="fa-solid fa-skull"></i>
                    <span>${clip.title}</span>
                `;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.clip-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadClip(clip, platform);
                });
                container.appendChild(btn);
            });
        }

        function loadClip(clip, platform) {
            const player = document.getElementById('clip-player');
            let src = '';

            if (platform === "dzen") {
                src = `https://dzen.ru/embed/${clip.dzenId}`;
            } else if (platform === "twitch") {
                src = `https://clips.twitch.tv/embed?clip=${clip.twitchId}&parent=ripsite666.netlify.app`;
            }

            player.src = src;
        }

        function switchPlatform(platform) {
            currentPlatform = platform;
            document.querySelectorAll('.platform-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.platform === platform);
            });
            createClipButtons(platform);
            if (minecraftClips.length > 0) {
                loadClip(minecraftClips[0], platform);
            }
        }

        window.onload = function() {
            createClipButtons("dzen");
            if (minecraftClips.length > 0) {
                loadClip(minecraftClips[0], "dzen");
            }

            document.querySelectorAll('.platform-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    switchPlatform(btn.dataset.platform);
                });
            });
        };
    </script>
</body>
</html>
